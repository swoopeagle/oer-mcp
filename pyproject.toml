[project]
name = "oer-mcp-workspace"
version = "0.1.0"
description = "OER MCP — curriculum content retrieval layer for LLMs (workspace root)"
requires-python = ">=3.11"
dependencies = [
    "oer-shared",
    "oer-ingestion",
    "oer-server",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
oer-shared = { workspace = true }
oer-ingestion = { workspace = true }
oer-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
