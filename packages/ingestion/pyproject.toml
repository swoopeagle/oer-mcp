[project]
name = "oer-ingestion"
version = "1.1.0"
description = "Seven-stage ingestion pipeline and source adapters for the OER MCP"
requires-python = ">=3.11"
dependencies = [
    "oer-shared",
    "httpx>=0.27",
    "lxml>=5.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oer_ingestion"]

[dependency-groups]
dev = [
    "pdfminer-six>=20260107",
    "pypdf>=6.14.2",
]
