[project]
name = "oer-server"
version = "0.1.0"
description = "OER MCP stdio server — curriculum content retrieval tools for LLMs"
requires-python = ">=3.11"
dependencies = [
    "oer-shared",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.scripts]
oer-mcp = "oer_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oer_server"]
